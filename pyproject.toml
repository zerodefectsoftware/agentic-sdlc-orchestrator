[project]
name = "agentic-sdlc-orchestrator"
version = "0.1.0"
description = "Agentic SDLC orchestrator, demonstrated by building a URL shortener"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "networkx>=3.4",
    "typer>=0.15",
    "rich>=13.9",
    "anthropic>=0.69",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
]

[project.scripts]
orchestrator = "orchestrator.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The target is deliberately not packaged — it is an arbitrary codebase the
# orchestrator operates on, not part of the deliverable (D3).
packages = ["src/orchestrator"]

[tool.pytest.ini_options]
# Our suite only. The target's tests are agent-written and run separately,
# via the command in config/target.shortener.yaml.
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"
# Target code is linted by the gate, using the target profile's command —
# not by our own lint run, whose failures would be our problem to fix.
extend-exclude = ["target"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
